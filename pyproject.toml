[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "optovessel-optical-coherence-angiography-engine"
version = "0.1.0"
description = "Autonomous Optical Coherence Tomography Angiography (OCTA) Microvascular Hemodynamics & Capillary Perfusion Engine: Complex Decorrelation, Split-Spectrum Amplitude-Decorrelation Angiography (SSADA), Phase-Variance Angiography (PVA), Depth-Resolved Plexus Segmentation, Vessel Skeletonization, and Non-Perfusion Area Detection."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Ayush Kandwal", email = "ayushkandwal2007@gmail.com" }
]
keywords = [
    "octa",
    "optical-coherence-tomography",
    "angiography",
    "microvascular-hemodynamics",
    "ophthalmology",
    "diabetic-retinopathy",
    "retinal-imaging",
    "ssada",
    "medical-image-processing",
    "biophotonics",
    "capillary-perfusion"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
optovessel = "optovessel.demo:main"

[tool.hatch.build.targets.wheel]
packages = ["optovessel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
